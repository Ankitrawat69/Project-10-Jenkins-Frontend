<div class="container-fluid" style="background-image: url('assets/img/college.jpg');
     background-size: cover;
     background-attachment: fixed;
     min-height: 100vh;
     padding-top: 75px;">

    <div class="row">
        <div class="col-md-4"></div>

        <div class="col-md-4">

            <div class="card shadow-lg">
                <div class="card-body">

                    <!-- TITLE -->
                    <h3 class="text-center text-primary font-weight-bold" *ngIf="!form.data.id">
                        Add Press
                    </h3>

                    <h3 class="text-center text-primary font-weight-bold" *ngIf="form.data.id>0">
                        Update Press
                    </h3>

                    <!-- SUCCESS -->
                    <div *ngIf="form.error == false && form.message"
                        class="alert alert-success alert-dismissible text-center">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{ form.message }}
                    </div>

                    <!-- ERROR -->
                    <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible text-center">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{ form.message }}
                    </div>

                    <!-- PRESS RELEASE ID -->
                    <label><b>Press Release Id *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fa fa-id-badge"></i>
                            </span>
                        </div>
                        <input type="text" class="form-control" name="pressReleaseId"
                            [(ngModel)]="form.data.pressReleaseId" placeholder="Enter Press Release Id">
                    </div>
                    <div>
                        <span class="text-danger">{{form.inputerror.pressReleaseId}}</span>
                    </div>

                    <!-- TITLE -->
                    <label><b>Title *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fa fa-file-text"></i>
                            </span>
                        </div>
                        <input type="text" class="form-control" name="title"
                            [(ngModel)]="form.data.title" placeholder="Enter Title">
                    </div>
                    <div>
                        <span class="text-danger">{{form.inputerror.title}}</span>
                    </div>

                    <!-- RELEASE DATE -->
                    <label><b>Release Date *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fa fa-calendar"></i>
                            </span>
                        </div>
                        <input type="date" class="form-control" name="releaseDate"
                            [(ngModel)]="form.data.releaseDate">
                    </div>
                    <div>
                        <span class="text-danger">{{form.inputerror.releaseDate}}</span>
                    </div>

                    <!-- AUTHOR -->
                    <label><b>Author *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fa fa-user"></i>
                            </span>
                        </div>
                        <input type="text" class="form-control" name="author"
                            [(ngModel)]="form.data.author" placeholder="Enter Author">
                    </div>
                    <div>
                        <span class="text-danger">{{form.inputerror.author}}</span>
                    </div>

                    <!-- BUTTONS -->
                    <div class="text-center mt-4">

                        <button *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                            Save
                        </button>

                        <button *ngIf="form.data.id" (click)="submit()" class="btn btn-success mr-2">
                            Update
                        </button>

                        <button *ngIf="!form.data.id" (click)="reset()" class="btn btn-warning mr-2">
                            Reset
                        </button>

                        <button *ngIf="form.data.id" (click)="forward('/presslist')" class="btn btn-warning">
                            List
                        </button>

                    </div>

                </div>
            </div>

        </div>

        <div class="col-md-4"></div>
    </div>

</div>
