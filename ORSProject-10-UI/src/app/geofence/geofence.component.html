<div class="container-fluid"
     style="background-image: url('assets/img/list2.jpg');
     background-size: cover;
     background-attachment: fixed;
     min-height: 100vh;
     padding-top: 75px;
     padding-bottom: 75px;">

    <div class="row">
        <div class="col-md-4"></div>

        <div class="col-md-4">

            <div class="card shadow-lg">
                <div class="card-body">

                    <!-- TITLE -->
                    <h3 class="text-center text-primary font-weight-bold"
                        *ngIf="!form.data.id">
                        Add GeoFence
                    </h3>

                    <h3 class="text-center text-primary font-weight-bold"
                        *ngIf="form.data.id>0">
                        Update GeoFence
                    </h3>

                    <!-- MESSAGE -->
                    <div *ngIf="form.error == false && form.message"
                         class="alert alert-success alert-dismissible text-center">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{ form.message }}
                    </div>

                    <div *ngIf="form.error && form.message"
                         class="alert alert-danger alert-dismissible text-center">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{ form.message }}
                    </div>

                    <!-- GEOFENCE ID -->
                    <label><b>GeoFence Id *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-id-card"></i></span>
                        </div>
                        <input type="text" class="form-control"
                               name="geoFenceId"
                               [(ngModel)]="form.data.geoFenceId"
                               placeholder="Enter GeoFence Id">
                    </div>
                    <div>
                    <span class="text-danger">{{form.inputerror.geoFenceId}}</span>
                    </div>

                    <!-- GEOFENCE CODE -->
                    <label><b>GeoFence Code *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-code"></i></span>
                        </div>
                        <input type="text" class="form-control"
                               name="geoFenceCode"
                               [(ngModel)]="form.data.geoFenceCode"
                               placeholder="Enter GeoFence Code">
                    </div>
                     <div>
                    <span class="text-danger">{{form.inputerror.geoFenceCode}}</span>
                    </div>
                    <!-- LOCATION NAME -->
                    <label><b>Location Name *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-map-marker"></i></span>
                        </div>
                        <input type="text" class="form-control"
                               name="locationName"
                               [(ngModel)]="form.data.locationName"
                               placeholder="Enter Location Name">
                    </div>
                        <div>
                    <span class="text-danger">{{form.inputerror.locationName}}</span>
                    </div>

                    <!-- RADIUS -->
                    <label><b>Radius *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-circle"></i></span>
                        </div>
                        <input type="text" class="form-control"
                               name="radius"
                               [(ngModel)]="form.data.radius"
                               placeholder="Enter Radius">
                    </div>
                        <div>
                    <span class="text-danger">{{form.inputerror.radius}}</span>
                    </div>

                    <!-- STATUS -->
                    <label><b>Status *</b></label>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-toggle-on"></i></span>
                        </div>
                        <select class="form-control"
                                name="status"
                                [(ngModel)]="form.data.status">
                            <option value="undefined">Select Status</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                        <div>
                    <span class="text-danger">{{form.inputerror.status}}</span>
                    </div>

                    <!-- BUTTONS -->
                    <div class="text-center mt-4">

                        <button *ngIf="!form.data.id"
                                (click)="submit()"
                                class="btn btn-success mr-2">Save</button>

                        <button *ngIf="form.data.id"
                                (click)="submit()"
                                class="btn btn-success mr-2">Update</button>

                        <button *ngIf="!form.data.id"
                                (click)="reset()"
                                class="btn btn-warning mr-2">Reset</button>

                        <button *ngIf="form.data.id"
                                (click)="forward('/geofencelist')"
                                class="btn btn-warning">List</button>

                    </div>

                </div>
            </div>

        </div>

        <div class="col-md-4"></div>
    </div>

</div>
